{{ define "main" }}
<article class="resume-page">
    <!-- Header -->
    <div class="resume-hero">
        <div class="resume-avatar">
            <div class="avatar-placeholder">应</div>
        </div>
        <h1 class="resume-name">应金益</h1>
        <div class="resume-name-en">Ying Jinyi</div>
        <div class="resume-tags">
            <span class="resume-tag">IT 审计</span>
            <span class="resume-tag">测试开发</span>
            <span class="resume-tag">自动化</span>
            <span class="resume-tag">信息安全</span>
        </div>
        <div class="resume-contact-bar">
            <span>📞 15858235967</span>
            <span class="contact-divider">|</span>
            <span>📧 593614984@qq.com</span>
            <span class="contact-divider">|</span>
            <span>🎓 浙江工业大学</span>
        </div>
    </div>

    {{ .Content }}

    <!-- Floating download button placeholder -->
    <div class="resume-actions">
        <button class="resume-print-btn" onclick="window.print()">
            🖨️ 打印 / 导出 PDF
        </button>
    </div>
</article>

<style>
/* ============================================
   RESUME — Modern Card Design
   ============================================ */

/* --- Hero Section --- */
.resume-hero {
    text-align: center;
    padding: 3rem 1.5rem 2rem;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border-radius: 16px;
    margin-bottom: 2.5rem;
    position: relative;
    overflow: hidden;
    animation: resumeFadeIn 0.6s ease;
}

.resume-hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
    animation: resumeGlow 8s ease-in-out infinite alternate;
}

@keyframes resumeGlow {
    0% { transform: translate(0, 0); }
    100% { transform: translate(10%, 10%); }
}

.resume-avatar {
    position: relative;
    z-index: 1;
    margin-bottom: 1rem;
}

.avatar-placeholder {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(4px);
    border: 3px solid rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    margin: 0 auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.resume-name {
    position: relative;
    z-index: 1;
    font-size: 2.4rem;
    color: #fff;
    margin-bottom: 0.2rem;
    font-weight: 800;
    letter-spacing: 2px;
}

.resume-name-en {
    position: relative;
    z-index: 1;
    font-size: 1rem;
    color: rgba(255,255,255,0.8);
    margin-bottom: 1rem;
    font-weight: 400;
    letter-spacing: 3px;
}

.resume-tags {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 1.2rem;
}

.resume-tag {
    display: inline-block;
    padding: 0.3rem 0.9rem;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    font-size: 0.8rem;
    color: #fff;
    font-weight: 500;
}

.resume-contact-bar {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.9);
}

.contact-divider {
    color: rgba(255,255,255,0.4);
}

/* --- Section Cards --- */
.resume-section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.8rem 2rem;
    margin-bottom: 1.5rem;
    transition: all 0.3s ease;
    animation: resumeFadeIn 0.5s ease backwards;
}

.resume-section:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--accent);
}

.resume-section:nth-child(1) { animation-delay: 0.1s; }
.resume-section:nth-child(2) { animation-delay: 0.2s; }
.resume-section:nth-child(3) { animation-delay: 0.3s; }
.resume-section:nth-child(4) { animation-delay: 0.4s; }
.resume-section:nth-child(5) { animation-delay: 0.5s; }

@keyframes resumeFadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.section-title {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 1.2rem;
    padding-bottom: 0.6rem;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text);
}

.section-title .title-icon {
    font-size: 1.2rem;
}

.section-title::after {
    content: '';
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    margin-left: 0.5rem;
}

/* --- Timeline --- */
.timeline {
    position: relative;
    padding-left: 2rem;
}

.timeline::before {
    content: '';
    position: absolute;
    left: 7px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: var(--border);
}

.timeline-item {
    position: relative;
    padding-bottom: 1.8rem;
}

.timeline-item:last-child {
    padding-bottom: 0;
}

.timeline-dot {
    position: absolute;
    left: -2rem;
    top: 4px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 2px var(--accent);
    z-index: 1;
}

.timeline-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.4rem;
}

.timeline-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
}

.timeline-sub {
    font-size: 0.9rem;
    color: var(--accent);
    font-weight: 600;
}

.timeline-date {
    display: inline-block;
    padding: 0.2rem 0.7rem;
    background: var(--tag-bg);
    color: var(--tag-text);
    border-radius: 12px;
    font-size: 0.78rem;
    font-weight: 500;
    white-space: nowrap;
}

.timeline-org {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin-bottom: 0.6rem;
    font-weight: 500;
}

.timeline-body {
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--text);
}

.timeline-body ul {
    padding-left: 1.2rem;
    margin-top: 0.4rem;
}

.timeline-body li {
    margin-bottom: 0.4rem;
    line-height: 1.6;
}

.timeline-body li::marker {
    color: var(--accent);
}

/* --- Highlight Box (for achievements) --- */
.highlight-box {
    background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(139,92,246,0.08));
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 0.8rem 1rem;
    margin: 0.8rem 0;
    font-size: 0.9rem;
    color: var(--text);
    font-style: italic;
}

/* --- Skills Grid --- */
.skills-modern {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
}

.skill-category {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem;
    transition: all 0.3s ease;
}

.skill-category:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
}

.skill-cat-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.skill-items {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.skill-badge {
    display: inline-block;
    padding: 0.25rem 0.7rem;
    background: var(--tag-bg);
    color: var(--tag-text);
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 500;
    transition: all 0.2s ease;
}

.skill-badge:hover {
    background: var(--accent);
    color: #fff;
    transform: translateY(-1px);
}

/* --- Education Card --- */
.edu-card {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
}

.edu-icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
}

.edu-info h3 {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 0.2rem;
}

.edu-info p {
    font-size: 0.9rem;
    color: var(--text-secondary);
}

.edu-rank {
    margin-left: auto;
    padding: 0.3rem 0.8rem;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
}

/* --- Honors Section --- */
.honors-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
}

.honor-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.9rem;
    background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(139,92,246,0.1));
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text);
    transition: all 0.3s ease;
}

.honor-badge:hover {
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(59,130,246,0.3);
}

/* --- Summary Section --- */
.summary-text {
    font-size: 0.95rem;
    line-height: 1.9;
    color: var(--text);
}

.summary-text p {
    margin-bottom: 0.8rem;
    padding-left: 1rem;
    border-left: 3px solid var(--accent);
    padding-left: 1rem;
}

/* --- Actions --- */
.resume-actions {
    text-align: center;
    margin-top: 2rem;
    margin-bottom: 1rem;
}

.resume-print-btn {
    padding: 0.7rem 2rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
    transition: all 0.3s ease;
}

.resume-print-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(59,130,246,0.3);
}

/* --- Print Styles --- */
@media print {
    .header, .footer, #back-to-top, #reading-progress, .resume-actions,
    #search-overlay, .theme-toggle {
        display: none !important;
    }
    .resume-hero {
        background: #3b82f6 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    .resume-section {
        break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #ddd !important;
    }
    .timeline-dot {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    .edu-rank, .honor-badge, .skill-badge {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
}

/* --- Responsive --- */
@media (max-width: 768px) {
    .resume-hero {
        padding: 2rem 1rem 1.5rem;
        border-radius: 12px;
    }
    .resume-name {
        font-size: 1.8rem;
    }
    .resume-section {
        padding: 1.2rem 1rem;
    }
    .timeline {
        padding-left: 1.5rem;
    }
    .timeline-dot {
        left: -1.5rem;
        width: 12px;
        height: 12px;
    }
    .timeline-header {
        flex-direction: column;
    }
    .skills-modern {
        grid-template-columns: 1fr;
    }
    .edu-card {
        flex-direction: column;
        align-items: flex-start;
    }
    .edu-rank {
        margin-left: 0;
    }
    .resume-contact-bar {
        flex-direction: column;
        gap: 0.2rem;
    }
    .contact-divider {
        display: none;
    }
}
</style>
{{ end }}
